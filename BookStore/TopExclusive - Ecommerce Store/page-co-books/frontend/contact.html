{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="{% static 'css/style (1).css' %}">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'book_list' %}">Books</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'contact' %}">Contact</a>
        <a href="{% url 'login_page' %}" data-login-link>Login</a>
        <a href="{% url 'signup_page' %}" data-signup-link>Sign Up</a>
        <a href="{% url 'cart_page' %}">Cart (<span id="cart-count">0</span>)</a>
        <a href="{% url 'orders_page' %}">My Orders</a>
        <a href="#" data-logout-link hidden>Log out</a>
</nav>

<!-- Contact -->
<section class="contact">
    <h2>Contact Us</h2>
    <p>Email: PageCo.Books@gmail.com | Phone: 060 639 3755 | Johannesburg, South Africa</p>
    <form class="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name">

        <label for="email">Email</label>
        <input type="email" id="email">

        <label for="subject">Subject</label>
        <input type="text" id="subject">

        <label for="msg">Message</label>
        <textarea id="msg" rows="5"></textarea>

        <button class="btn" type="submit">Submit</button>
        <p class="message" id="message"></p>
    </form>
</section>

<!-- Footer -->
<footer class="footer">
    <p>2026 Page Co. Books | Exclusive books, delivered to you.</p>
</footer>
<script src="{% static 'js/script (1).js' %}"></script>
</body>
</html>
