{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{% static 'css/style (1).css' %}">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'book_list' %}">Books</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'contact' %}">Contact</a>
        <a href="{% url 'login_page' %}" data-login-link>Login</a>
        <a href="{% url 'signup_page' %}" data-signup-link>Sign Up</a>
        <a href="{% url 'cart_page' %}">Cart (<span id="cart-count">0</span>)</a>
        <a href="{% url 'orders_page' %}">My Orders</a>
        <a href="#" data-logout-link hidden>Log out</a>
</nav>

<!-- Sign Up Form -->
<div class="signup-container">
    <h2>Create Your Account</h2>
    <form id="signup-form">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" maxlength="100" autocomplete="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" maxlength="254" autocomplete="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" required>

        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" autocomplete="new-password" required>

        <p><input type="checkbox" id="terms" required> I agree to the terms</p>

        <button class="btn" type="submit">Create Account</button>
        <p class="message" id="message"></p>
    </form>

    <p>Already have an account? <a href="{% url 'login_page' %}">Login</a></p>
</div>

<!-- Footer -->
<footer class="footer">
    <p>2026 Page Co. Books | Exclusive books, delivered to you.</p>
</footer>
<script src="{% static 'js/script (1).js' %}"></script>
</body>
</html>
