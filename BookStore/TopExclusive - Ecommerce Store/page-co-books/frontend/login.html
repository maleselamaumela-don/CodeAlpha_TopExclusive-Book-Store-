{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/style (1).css' %}">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'book_list' %}">Books</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'contact' %}">Contact</a>
        <a href="{% url 'login_page' %}" data-login-link>Login</a>
        <a href="{% url 'signup_page' %}" data-signup-link>Sign Up</a>
        <a href="{% url 'cart_page' %}">Cart (<span id="cart-count">0</span>)</a>
        <a href="{% url 'orders_page' %}">My Orders</a>
        <a href="#" data-logout-link hidden>Log out</a>
</nav>

<!-- Login Form -->
<div class="login-container">
    <h2>Welcome Back</h2>
    <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>

        <p><input type="checkbox" id="remember"> Remember me</p>

        <button class="btn" type="submit">Login</button>
        <p class="message" id="message"></p>
    </form>
    <p><a href="#">Forgot Password?</a></p>
    <p>Don't have an account? <a href="{% url 'signup_page' %}">Sign Up</a></p>
</div>

<!-- Footer -->
<footer class="footer">
    <p>2026 Page Co. Books | Exclusive books, delivered to you.</p>
</footer>
<script src="{% static 'js/script (1).js' %}"></script>
</body>
</html>
