{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Page Co. Books</title>
    <link rel="stylesheet" href="{% static 'css/style (1).css' %}">
</head>
<body>
<nav class="navbar">
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'book_list' %}">Books</a>
    <a href="{% url 'about' %}">About</a>
    <a href="{% url 'contact' %}">Contact</a>
    <a href="{% url 'login_page' %}" data-login-link>Login</a>
    <a href="{% url 'signup_page' %}" data-signup-link>Sign Up</a>
    <a href="{% url 'cart_page' %}">Cart (<span id="cart-count">0</span>)</a>
    <a href="{% url 'orders_page' %}">My Orders</a>
    <a href="#" data-logout-link hidden>Log out</a>
</nav>

<main class="orders-page">
    <h1>My Orders</h1>
    <p>View the orders you have placed with Page Co. Books.</p>
    <p class="message" id="message" role="status" aria-live="polite"></p>
    <section id="orders-list" class="orders-list" aria-live="polite"></section>
</main>

<footer class="footer">
    <p>2026 Page Co. Books | Exclusive books, delivered to you.</p>
</footer>
<script src="{% static 'js/script (1).js' %}"></script>
</body>
</html>
