{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart</title>
    <link rel="stylesheet" href="{% static 'css/style (1).css' %}">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'book_list' %}">Books</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'contact' %}">Contact</a>
        <a href="{% url 'login_page' %}" data-login-link>Login</a>
        <a href="{% url 'signup_page' %}" data-signup-link>Sign Up</a>
        <a href="{% url 'cart_page' %}">Cart (<span id="cart-count">0</span>)</a>
        <a href="{% url 'orders_page' %}">My Orders</a>
        <a href="#" data-logout-link hidden>Log out</a>
</nav>

<!-- Shopping Cart -->
<section class="cart">
    <h2>Your Cart</h2>

    <table class="cart-table">
        <thead>
            <tr><th>Book</th><th>Title</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th>Remove</th></tr>
        </thead>
        <tbody id="cart-items"></tbody>
    </table>

    <h3 class="cart-total">Total: <span id="cart-total">R0</span></h3>
    <form id="checkout-form">
        <h3>Delivery details</h3>
        <label for="checkout-name">Full name</label>
        <input type="text" id="checkout-name" maxlength="100" autocomplete="name" required>

        <label for="checkout-email">Email</label>
        <input type="email" id="checkout-email" maxlength="254" autocomplete="email" required>

        <label for="checkout-phone">Phone</label>
        <input type="tel" id="checkout-phone" maxlength="30" autocomplete="tel" required>

        <label for="checkout-address">Street address</label>
        <input type="text" id="checkout-address" maxlength="250" autocomplete="street-address" required>

        <label for="checkout-city">City</label>
        <input type="text" id="checkout-city" maxlength="100" autocomplete="address-level2" required>

        <label for="checkout-postal-code">Postal code</label>
        <input type="text" id="checkout-postal-code" maxlength="20" autocomplete="postal-code" required>

        <button class="btn" type="submit">Place Order</button>
        <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>
</section>

<!-- Footer -->
<footer class="footer">
    <p>2026 Page Co. Books | Exclusive books, delivered to you.</p>
</footer>
<script src="{% static 'js/script (1).js' %}"></script>
</body>
</html>
